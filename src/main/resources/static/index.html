<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MBTiles 矢量瓦片服务器 - 实时预览</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #111827;
      color: #f3f4f6;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    /* Control Panel */
    .panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(17, 24, 39, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 18px 20px;
      min-width: 320px;
      max-width: 380px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .panel-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      color: #60a5fa;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-label {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 5px;
      display: block;
      font-weight: 500;
    }
    select, button {
      width: 100%;
      background: #1f2937;
      border: 1px solid #374151;
      color: #f9fafb;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    select:focus, button:hover {
      border-color: #3b82f6;
    }
    button {
      background: #2563eb;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    button:hover {
      background: #1d4ed8;
    }
    /* HUD Overlay */
    .hud {
      position: absolute;
      bottom: 24px;
      left: 16px;
      z-index: 10;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      font-family: monospace;
      color: #d1d5db;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .hud-row {
      display: flex;
      gap: 12px;
    }
    .hud-val {
      color: #38bdf8;
      font-weight: 600;
    }
    /* Layer Switcher */
    .layer-box {
      margin-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    .layer-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .layer-item input {
      accent-color: #3b82f6;
      cursor: pointer;
    }
    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      background: #065f46;
      color: #34d399;
      margin-left: auto;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="panel">
    <div class="panel-title">
      <span>🗺️ MBTiles 瓦片服务</span>
      <span id="health-badge" class="status-badge">检测中...</span>
    </div>

    <div class="form-group">
      <label class="form-label" for="dataset-select">当前数据集</label>
      <select id="dataset-select">
        <option value="">加载中...</option>
      </select>
    </div>

    <div id="meta-summary" style="font-size: 11px; color: #9ca3af; margin-bottom: 10px;">
      <div>层级范围: <span id="meta-zoom" class="hud-val">-</span></div>
      <div>格式: <span id="meta-format" class="hud-val">-</span> | 大小: <span id="meta-size" class="hud-val">-</span></div>
    </div>

    <button id="btn-fit">全图范围居中</button>

    <div class="layer-box" id="layer-container" style="display: none;">
      <div class="form-label">图层控制</div>
      <div id="layer-list"></div>
    </div>
  </div>

  <div class="hud">
    <div class="hud-row">
      <span>缩放层级 (Zoom): <span id="hud-zoom" class="hud-val">0.00</span></span>
      <span>瓦片坐标: <span id="hud-tile" class="hud-val">z/x/y</span></span>
    </div>
    <div class="hud-row">
      <span>经度 (Lng): <span id="hud-lng" class="hud-val">0.0000</span></span>
      <span>纬度 (Lat): <span id="hud-lat" class="hud-val">0.0000</span></span>
    </div>
  </div>

  <script>
    const COLORS = [
      '#ef4444', '#3b82f6', '#10b981', '#f59e0b',
      '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'
    ];

    let currentDatasetInfo = null;
    let addedLayerIds = [];

    // Initialize MapLibre
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {},
        layers: [
          {
            id: 'background',
            type: 'background',
            paint: { 'background-color': '#111827' }
          }
        ]
      },
      center: [105.0, 35.0],
      zoom: 3
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(new maplibregl.ScaleControl(), 'bottom-right');

    // Telemetry updates
    function updateHud(lngLat) {
      const zoom = map.getZoom();
      document.getElementById('hud-zoom').innerText = zoom.toFixed(2);
      if (lngLat) {
        document.getElementById('hud-lng').innerText = lngLat.lng.toFixed(4);
        document.getElementById('hud-lat').innerText = lngLat.lat.toFixed(4);

        const zInt = Math.floor(zoom);
        const x = Math.floor((lngLat.lng + 180) / 360 * Math.pow(2, zInt));
        const latRad = lngLat.lat * Math.PI / 180;
        const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * Math.pow(2, zInt));
        document.getElementById('hud-tile').innerText = `${zInt} / ${x} / ${y}`;
      }
    }

    map.on('mousemove', e => updateHud(e.lngLat));
    map.on('zoom', () => updateHud(map.getCenter()));

    // Fetch health status
    fetch('/tiles/health')
      .then(res => res.text())
      .then(txt => {
        const badge = document.getElementById('health-badge');
        badge.innerText = txt.includes('UP') ? '服务正常' : '异常';
      })
      .catch(() => {
        document.getElementById('health-badge').innerText = '未连接';
        document.getElementById('health-badge').style.background = '#7f1d1d';
        document.getElementById('health-badge').style.color = '#fca5a5';
      });

    // Load available datasets
    async function loadDatasets() {
      try {
        const res = await fetch('/tiles/datasets');
        const datasets = await res.json();
        const select = document.getElementById('dataset-select');
        select.innerHTML = '';

        if (!datasets || datasets.length === 0) {
          select.innerHTML = '<option>未找到 .mbtiles 数据集</option>';
          return;
        }

        datasets.forEach((ds, idx) => {
          const opt = document.createElement('option');
          opt.value = ds.name;
          opt.innerText = `${ds.name} (${(ds.fileSize / 1024 / 1024).toFixed(1)} MB)`;
          select.appendChild(opt);
        });

        select.addEventListener('change', () => {
          const chosen = datasets.find(d => d.name === select.value);
          if (chosen) selectDataset(chosen);
        });

        // Auto select first
        selectDataset(datasets[0]);
      } catch (err) {
        console.error('加载数据集失败', err);
      }
    }

    // Switch dataset
    function selectDataset(ds) {
      currentDatasetInfo = ds;
      document.getElementById('meta-zoom').innerText = `z${ds.minzoom} ~ z${ds.maxzoom}`;
      document.getElementById('meta-format').innerText = ds.format.toUpperCase();
      document.getElementById('meta-size').innerText = `${(ds.fileSize / 1024 / 1024).toFixed(1)} MB`;

      // Clear existing layers & sources
      addedLayerIds.forEach(id => {
        if (map.getLayer(id)) map.removeLayer(id);
      });
      addedLayerIds = [];
      if (map.getSource('mbtiles-src')) {
        map.removeSource('mbtiles-src');
      }

      // Add TileJSON vector source
      const tileJsonUrl = `/tiles/${ds.name}/tilejson.json`;
      map.addSource('mbtiles-src', {
        type: 'vector',
        url: tileJsonUrl
      });

      // Render layers
      const layerContainer = document.getElementById('layer-container');
      const layerList = document.getElementById('layer-list');
      layerList.innerHTML = '';

      if (ds.vectorLayers && ds.vectorLayers.length > 0) {
        layerContainer.style.display = 'block';
        ds.vectorLayers.forEach((layer, idx) => {
          const color = COLORS[idx % COLORS.length];
          const lineLayerId = `tile-line-${layer.id}`;
          const pointLayerId = `tile-pt-${layer.id}`;

          // Add line visualization
          map.addLayer({
            id: lineLayerId,
            type: 'line',
            source: 'mbtiles-src',
            'source-layer': layer.id,
            paint: {
              'line-color': color,
              'line-width': 1.5,
              'line-opacity': 0.85
            }
          });
          addedLayerIds.push(lineLayerId);

          // Add point/circle visualization
          map.addLayer({
            id: pointLayerId,
            type: 'circle',
            source: 'mbtiles-src',
            'source-layer': layer.id,
            filter: ['==', '$type', 'Point'],
            paint: {
              'circle-color': color,
              'circle-radius': 3.5,
              'circle-stroke-width': 1,
              'circle-stroke-color': '#ffffff'
            }
          });
          addedLayerIds.push(pointLayerId);

          // Build UI toggle item
          const item = document.createElement('label');
          item.className = 'layer-item';
          item.innerHTML = `
            <input type="checkbox" checked data-layers="${lineLayerId},${pointLayerId}">
            <span class="color-dot" style="background: ${color}"></span>
            <span>${layer.id}</span>
          `;
          item.querySelector('input').addEventListener('change', e => {
            const visibility = e.target.checked ? 'visible' : 'none';
            map.setLayoutProperty(lineLayerId, 'visibility', visibility);
            map.setLayoutProperty(pointLayerId, 'visibility', visibility);
          });
          layerList.appendChild(item);
        });
      } else {
        // Fallback default layer
        layerContainer.style.display = 'none';
        const defaultLayerId = 'tile-default-render';
        map.addLayer({
          id: defaultLayerId,
          type: 'line',
          source: 'mbtiles-src',
          'source-layer': ds.name,
          paint: { 'line-color': '#38bdf8', 'line-width': 1.5 }
        });
        addedLayerIds.push(defaultLayerId);
      }

      // Fly to bounds
      fitToBounds();
    }

    function fitToBounds() {
      if (!currentDatasetInfo) return;
      const b = currentDatasetInfo.bounds;
      if (b && b.length === 4 && (b[0] !== -180 || b[2] !== 180)) {
        map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: 40 });
      } else if (currentDatasetInfo.center && currentDatasetInfo.center.length >= 2) {
        map.flyTo({
          center: [currentDatasetInfo.center[0], currentDatasetInfo.center[1]],
          zoom: currentDatasetInfo.center[2] || currentDatasetInfo.minzoom || 4
        });
      }
    }

    document.getElementById('btn-fit').addEventListener('click', fitToBounds);

    map.on('load', loadDatasets);
  </script>
</body>
</html>

server:
  port: 8445
  http2:
    enabled: false         # 开启 HTTP/2 需要 HTTPS；若启用 SSL 可设为 true
  ssl:
    enabled: false         # 若需要启用 HTTPS，设为 true 并确保 keystore.p12 存在
    key-store: classpath:keystore.p12
    key-store-password: 123456
    key-store-type: PKCS12
    key-alias: maptile
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html,text/xml,application/xml
    min-response-size: 1024   # ≥1KB 的文本与 JSON 响应才由 Tomcat 压缩；切片已在库内压缩无需二次压缩
  tomcat:
    threads:
      max: 200                # 最大工作线程数
      min-spare: 20           # 最小空闲线程数
    max-connections: 10000    # 最大连接数
    accept-count: 300         # 排队等待队列长度
    connection-timeout: 60000 # 连接超时时间 (ms)
    max-keep-alive-requests: -1 # 保持 HTTP Keep-Alive 长连接无上限，避免地图拖拽频繁断开重新握手
    keep-alive-timeout: 60000ms # 空闲连接保活 60 秒

mbtiles:
  # MBTiles / SQLite 数据文件存储目录（支持相对路径或绝对路径）
  data-dir: ./data
  # 是否开启基于元数据 bounds 的空间短路过滤（默认 false：彻底杜绝元数据标小导致的边缘切片误杀白块）
  bounds-filter-enabled: false
  # SQLite HikariCP 连接池配置（针对多文件海量数据源高并发低延迟调优）
  pool:
    max-size: 40              # 单数据集最大并发连接数提升至 40，保障一屏 30~50 瓦片瞬间并发无排队
    min-idle: 10              # 最小常驻空闲连接设为 10，保持热连接就绪，彻底消除冷启动几十毫秒的文件重开耗时
    idle-timeout: 600000      # 10 分钟无请求才缓慢释放超出 min-idle 的多余连接
    connection-timeout: 30000 # 获取连接超时时间 (ms)
    max-lifetime: 1800000     # 连接最大生命周期 (30分钟)
    max-active-pools: 50      # 最多常驻 50 个数据源连接池，超出时按 LRU 淘汰最久未访问连接池
  # 启动预加载热瓦片配置（智能防多文件缓存挤兑）
  warmup:
    enabled: true             # 是否在启动时预热低缩放层级瓦片
    max-zoom: 6               # 预热最大缩放层级 (0~maxZoom，单SQL批量预热)
    max-datasets: 3           # 文件过多时默认仅预热前 3 个核心底图，防止冲垮 Caffeine 缓存
    include-datasets: []      # 可选：指定显式预热的数据集名称列表（如 ["basemap_line_point"]）
  # HTTP 缓存响应头
  cache-control:
    max-age: 604800           # 浏览器/CDN 缓存有效时长（秒，默认 7 天）
    immutable: true           # 标记为 immutable 避免无意义的重复验证
  # 瓦片表结构与字段自适应探测配置（若后续有新增非标库，直接在下方追加无需改动 Java 代码）
  schema:
    candidate-table-names: [tiles, grids, grid]                      # 候选表名优先级
    candidate-data-columns: [tile_data, grid, data, image, content]  # 候选瓦片二进制/图片字段优先级
    candidate-zoom-columns: [zoom_level, zoom, z, level]             # 候选层级字段
    candidate-column-columns: [tile_column, col, column, x]          # 候选列号字段
    candidate-row-columns: [tile_row, row, y]                        # 候选行号字段
    # 可选：对特定特殊数据集做定制映射（取消注释即可启用）
    # dataset-overrides:
    #   special_map:
    #     table-name: custom_grids
    #     data-column: grid
    #     zoom-column: zoom_level
    #     col-column: tile_column
    #     row-column: tile_row
  # 切片文件变动智能热感知监听器（自动感知新增切片与覆盖更新）
  watcher:
    enabled: true                 # 开启后台自动监听
    watch-dir: ""                 # 可选：自定义监听目录（留空时默认自动监听上方 data-dir，支持相对路径如 ./data 或绝对路径如 D:/gis_data）
    debounce-ms: 1500             # 拷贝/修改防抖延迟（毫秒），等待大文件写入完成再重载

spring:
  cache:
    type: caffeine
    caffeine:
      # 瓦片内存缓存容量：初始分配 2,000 条防扩容拷贝，最大 50,000 条，30 分钟无访问自动过期，开启命中率统计
      spec: initialCapacity=2000,maximumSize=50000,expireAfterAccess=30m,recordStats

logging:
  level:
    com.map.mbtiles: INFO
    com.zaxxer.hikari: WARN
